<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 1.8em;
            color: #e2e8f0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
        }

        .inset-chart {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32%;
            height: 40%;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            padding: 2px;
            z-index: 10;
        }

        canvas {
            background: white;
            border-radius: 6px;
            width: 100% !important;
        }

        .status-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-card h2 {
            color: #94a3b8;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .readings-table {
            width: 100%;
            border-collapse: collapse;
        }

        .readings-table td {
            padding: 6px 4px;
            font-size: 0.95em;
        }

        .readings-table td:nth-child(2) {
            text-align: right;
            font-weight: bold;
            font-size: 1.1em;
            color: #38bdf8;
        }

        .readings-table td:nth-child(3) {
            text-align: left;
            padding-left: 6px;
            color: #94a3b8;
            font-size: 0.85em;
        }

        .divider {
            border: none;
            border-top: 1px solid #334155;
            margin: 6px 0;
        }

        .status {
            font-size: 1.2em;
            font-weight: bold;
            padding: 4px 0;
        }

        .safe   { color: #22c55e; }
        .unsafe { color: #ef4444; }

        .last-updated {
            font-size: 0.75em;
            color: #64748b;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .inset-chart { width: 40%; height: 35%; }
        }
    </style>
</head>

<body>

<h1>🌊 Water Quality Monitoring System</h1>

<div class="container">

    <div class="card">
        <div class="chart-wrapper">
            <canvas id="tempChart"></canvas>
            <div class="inset-chart"><canvas id="tempInset"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="chart-wrapper">
            <canvas id="ecChart"></canvas>
            <div class="inset-chart"><canvas id="ecInset"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="chart-wrapper">
            <canvas id="salChart"></canvas>
            <div class="inset-chart"><canvas id="salInset"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="chart-wrapper">
            <canvas id="phChart"></canvas>
            <div class="inset-chart"><canvas id="phInset"></canvas></div>
        </div>
    </div>

    <div class="card">
        <div class="chart-wrapper">
            <canvas id="tdsChart"></canvas>
            <div class="inset-chart"><canvas id="tdsInset"></canvas></div>
        </div>
    </div>

    <div class="status-card">
        <div>
            <h2>📡 Latest Raw Readings</h2>
            <table class="readings-table">
                <tr>
                    <td>🌡️ Temperature</td>
                    <td id="live-temp">--</td>
                    <td>°C</td>
                </tr>
                <tr>
                    <td>⚡ EC</td>
                    <td id="live-ec">--</td>
                    <td>mS/cm</td>
                </tr>
                <tr>
                    <td>🌊 Salinity</td>
                    <td id="live-sal">--</td>
                    <td>ppt</td>
                </tr>
                <tr>
                    <td>🧪 pH</td>
                    <td id="live-ph">--</td>
                    <td></td>
                </tr>
                <tr>
                    <td>💧 TDS</td>
                    <td id="live-tds">--</td>
                    <td>ppm</td>
                </tr>
            </table>
        </div>

        <hr class="divider">

        <div>
            <h2>🔒 Status</h2>
            <div id="currentStatus" class="status">Current: --</div>
            <div id="futureStatus"  class="status">Future: --</div>
        </div>

        <hr class="divider">

        <p class="last-updated">
            Last prediction update: <span id="lastUpdated">--</span>
        </p>
    </div>

</div>

<script type="module">
import { initializeApp }             from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
    apiKey:      "AIzaSyAgWgICxcrEMbrgw6LhXbZzmUymCOMhMXE",
    authDomain:  "thesis-project-38954.firebaseapp.com",
    databaseURL: "https://thesis-project-38954-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:   "thesis-project-38954",
};

const app      = initializeApp(firebaseConfig);
const database = getDatabase(app);

// ===== CHART DEFINITIONS =====
const chartConfigs = {
    temp: { id: 'tempChart', insetId: 'tempInset', title: 'Temperature vs Time', unit: '°C',    field: 'temperature' },
    ec:   { id: 'ecChart',   insetId: 'ecInset',   title: 'EC vs Time',          unit: 'mS/cm', field: 'ec'          },
    sal:  { id: 'salChart',  insetId: 'salInset',  title: 'Salinity vs Time',    unit: 'ppt',   field: 'salinity'    },
    ph:   { id: 'phChart',   insetId: 'phInset',   title: 'pH vs Time',          unit: 'pH',    field: 'ph'          },
    tds:  { id: 'tdsChart',  insetId: 'tdsInset',  title: 'TDS vs Time',         unit: 'ppm',   field: 'tds'         },
};

const charts      = {};
const insetCharts = {};
const MAX_POINTS  = 20;

const historyData = {
    temp: [], ec: [], sal: [], ph: [], tds: [], times: []
};

// ===== INIT CHARTS =====
function initCharts() {
    for (const [key, cfg] of Object.entries(chartConfigs)) {

        // Main chart — raw data only
        charts[key] = new Chart(document.getElementById(cfg.id), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label:       'Measured',
                    data:        [],
                    borderColor: 'blue',
                    fill:        false,
                    tension:     0.1,
                    pointRadius: 3,
                }]
            },
            options: {
                animation:  false,
                responsive: true,
                plugins: {
                    title:   { display: true, text: cfg.title, color: '#1e293b', font: { size: 14 } },
                    legend:  { labels: { color: '#1e293b' } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Time', color: '#1e293b' },
                        ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 }, color: '#1e293b' }
                    },
                    y: {
                        title: { display: true, text: cfg.unit, color: '#1e293b' },
                        ticks: { color: '#1e293b' }
                    }
                }
            }
        });

        // Inset chart — predicted only
        insetCharts[key] = new Chart(document.getElementById(cfg.insetId), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label:        'Predicted',
                    data:         [],
                    borderColor:  'red',
                    borderDash:   [4, 4],
                    borderWidth:  1.5,
                    fill:         false,
                    tension:      0.1,
                    pointRadius:  2,
                    pointBackgroundColor: 'red',
                }]
            },
            options: {
                animation:           false,
                responsive:          true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text:    '📈 Predicted',
                        color:   '#1e293b',
                        font:    { size: 9 },
                        padding: { top: 2, bottom: 2 }
                    },
                    legend:  { display: false },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: {
                        ticks: { display: false },
                        grid:  { display: false }
                    },
                    y: {
                        ticks: {
                            color:         '#1e293b',
                            font:          { size: 8 },
                            maxTicksLimit: 4
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    }
                }
            }
        });
    }
}

// ===== UPDATE MAIN CHARTS =====
function updateMainCharts() {
    const times = historyData.times.slice(-MAX_POINTS);
    for (const [key, chart] of Object.entries(charts)) {
        chart.data.labels           = times;
        chart.data.datasets[0].data = historyData[key].slice(-MAX_POINTS);
        chart.update();
    }
}

// ===== UPDATE INSET CHARTS =====
function updateInsetCharts(predictions) {
    if (!predictions) return;
    const now = new Date();

    for (const [key, cfg] of Object.entries(chartConfigs)) {
        const predData  = [];
        const predTimes = [];

        for (let i = 1; i <= 15; i++) {
            const point = predictions[`point${i}`];
            if (point && point[cfg.field] !== undefined) {
                predData.push(point[cfg.field]);
                const t = new Date(now.getTime() + i * 1000);
                predTimes.push(t.toLocaleTimeString());
            }
        }

        insetCharts[key].data.labels           = predTimes;
        insetCharts[key].data.datasets[0].data = predData;
        insetCharts[key].update();
    }
}

// ===== FIREBASE LISTENERS =====
let latestPredictions = null;

// Live raw sensor readings
onValue(ref(database, 'sensors'), (snapshot) => {
    const d = snapshot.val();
    if (!d) return;

    // Update live readings
    document.getElementById('live-temp').innerText = Number(d.temperature).toFixed(2);
    document.getElementById('live-ec').innerText   = Number(d.ec).toFixed(2);
    document.getElementById('live-sal').innerText  = Number(d.salinity).toFixed(2);
    document.getElementById('live-ph').innerText   = Number(d.ph).toFixed(2);
    document.getElementById('live-tds').innerText  = Number(d.tds).toFixed(2);

    // Current status from Python
    const currentEl     = document.getElementById('currentStatus');
    const isSafe        = d.current_status == 1;
    currentEl.innerText = 'Current: ' + (isSafe ? 'SAFE ✅' : 'UNSAFE ❌');
    currentEl.className = 'status ' + (isSafe ? 'safe' : 'unsafe');

    // Build history
    historyData.times.push(new Date().toLocaleTimeString());
    historyData.temp.push(d.temperature);
    historyData.ec.push(d.ec);
    historyData.sal.push(d.salinity);
    historyData.ph.push(d.ph);
    historyData.tds.push(d.tds);

    // Keep only last MAX_POINTS
    for (const key of Object.keys(historyData)) {
        if (historyData[key].length > MAX_POINTS) historyData[key].shift();
    }

    updateMainCharts();
});

// Predictions from MATLAB via Firebase
onValue(ref(database, 'predictions'), (snapshot) => {
    const d = snapshot.val();
    if (!d) return;

    latestPredictions = d;

    // Future status from MATLAB
    const futureEl   = document.getElementById('futureStatus');
    const futureSafe = d.point1 && d.point1.status == 1;
    futureEl.innerText  = 'Future: '  + (futureSafe ? 'SAFE ✅' : 'UNSAFE ❌');
    futureEl.className  = 'status '   + (futureSafe ? 'safe' : 'unsafe');

    document.getElementById('lastUpdated').innerText = d.last_updated || '--';

    updateInsetCharts(d);
});

// ===== START =====
initCharts();
</script>

</body>
</html>
