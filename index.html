<!DOCTYPE html>
<html>
<head>
    <title>Water Quality Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }
        canvas {
            background: white;
        }
        .status {
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>Water Quality Monitoring System</h1>

<div class="container">
    <div class="card"><canvas id="tempChart"></canvas></div>
    <div class="card"><canvas id="ecChart"></canvas></div>
    <div class="card"><canvas id="salChart"></canvas></div>
    <div class="card"><canvas id="phChart"></canvas></div>
    <div class="card"><canvas id="tdsChart"></canvas></div>

    <div class="card">
        <h2>Status</h2>
        <div id="currentStatus" class="status"></div>
        <div id="futureStatus" class="status"></div>
    </div>
</div>

<script>
const rawChannelID = "3270755";
const rawAPI = "Y7TTN9EJDLXY1B26";

const analysisChannelID = "3303145";
const analysisAPI = "08FNAI0NAMHJKB2Z";

// FETCH DATA
async function getRawData() {
    const res = await fetch(`https://api.thingspeak.com/channels/${rawChannelID}/feeds.json?api_key=${rawAPI}&results=20`);
    return await res.json();
}

async function getAnalysisData() {
    const res = await fetch(`https://api.thingspeak.com/channels/${analysisChannelID}/feeds.json?api_key=${analysisAPI}&results=10`);
    return await res.json();
}

// CREATE CHART WITH TIME SHIFT
function createChart(ctx, title, raw, pred, timeRaw, timePred, yLabel) {

    let fullTime = timeRaw.concat(timePred);

    let paddedRaw = raw.concat(new Array(pred.length).fill(null));
    let paddedPred = new Array(raw.length).fill(null).concat(pred);

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: fullTime,
            datasets: [
                {
                    label: "Measured",
                    data: paddedRaw,
                    borderColor: "blue",
                    fill: false
                },
                {
                    label: "Predicted",
                    data: paddedPred,
                    borderColor: "red",
                    borderDash: [5,5],
                    fill: false
                }
            ]
        },
        options: {
            plugins: {
                title: {
                    display: true,
                    text: title
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Time"
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: yLabel
                    }
                }
            }
        }
    });
}

async function loadData() {
    const rawData = await getRawData();
    const analysisData = await getAnalysisData();

    const feeds1 = rawData.feeds;
    const feeds2 = analysisData.feeds;

    if (feeds1.length === 0) return;

    // RAW VALUES
    const temp = feeds1.map(f => Number(f.field1));
    const ec   = feeds1.map(f => Number(f.field2));
    const sal  = feeds1.map(f => Number(f.field3));
    const ph   = feeds1.map(f => Number(f.field4));
    const tds  = feeds1.map(f => Number(f.field5));

    const timeRaw = feeds1.map(f => new Date(f.created_at).toLocaleTimeString());

    // ANALYSIS VALUES
    let temp_p=[], ec_p=[], sal_p=[], ph_p=[], tds_p=[];
    let timePred=[];

    if (feeds2.length > 0) {

        temp_p = feeds2.map(f => Number(f.field1));
        ec_p   = feeds2.map(f => Number(f.field2));
        sal_p  = feeds2.map(f => Number(f.field3));
        ph_p   = feeds2.map(f => Number(f.field4));
        tds_p  = feeds2.map(f => Number(f.field5));

        let lastTime = new Date(feeds1[feeds1.length - 1].created_at);

        for(let i=1;i<=feeds2.length;i++){
            let t = new Date(lastTime.getTime() + i*15000);
            timePred.push(t.toLocaleTimeString());
        }

        const last = feeds2[feeds2.length - 1];

        document.getElementById("currentStatus").innerText =
            "Current: " + (last.field6 == 1 ? "SAFE" : "UNSAFE");

        document.getElementById("futureStatus").innerText =
            "Future: " + (last.field8 == 1 ? "SAFE" : "UNSAFE");
    }

    // CREATE CHARTS
    createChart(tempChart, "Temperature vs Time", temp, temp_p, timeRaw, timePred, "°C");
    createChart(ecChart, "EC vs Time", ec, ec_p, timeRaw, timePred, "mS/cm");
    createChart(salChart, "Salinity vs Time", sal, sal_p, timeRaw, timePred, "ppt");
    createChart(phChart, "pH vs Time", ph, ph_p, timeRaw, timePred, "pH");
    createChart(tdsChart, "TDS vs Time", tds, tds_p, timeRaw, timePred, "ppm");
}

loadData();
</script>

</body>
</html>
