<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 1.8em;
            color: #e2e8f0;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        canvas { background: white; border-radius: 6px; }

        .status-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-card h2 {
            color: #94a3b8;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .readings-table {
            width: 100%;
            border-collapse: collapse;
        }

        .readings-table td {
            padding: 6px 4px;
            font-size: 0.95em;
        }

        .readings-table td:nth-child(2) {
            text-align: right;
            font-weight: bold;
            font-size: 1.1em;
            color: #38bdf8;
        }

        .readings-table td:nth-child(3) {
            text-align: left;
            padding-left: 6px;
            color: #94a3b8;
            font-size: 0.85em;
        }

        .divider {
            border: none;
            border-top: 1px solid #334155;
            margin: 6px 0;
        }

        .status {
            font-size: 1.2em;
            font-weight: bold;
            padding: 4px 0;
        }

        .safe   { color: #22c55e; }
        .unsafe { color: #ef4444; }

        .last-updated {
            font-size: 0.75em;
            color: #64748b;
            margin-top: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<h1>🌊 Water Quality Monitoring System</h1>

<div class="container">
    <div class="card"><canvas id="tempChart"></canvas></div>
    <div class="card"><canvas id="ecChart"></canvas></div>
    <div class="card"><canvas id="salChart"></canvas></div>
    <div class="card"><canvas id="phChart"></canvas></div>
    <div class="card"><canvas id="tdsChart"></canvas></div>

    <div class="status-card">

        <div>
            <h2>📡 Latest Raw Readings</h2>
            <table class="readings-table">
                <tr>
                    <td>🌡️ Temperature</td>
                    <td id="live-temp">--</td>
                    <td>°C</td>
                </tr>
                <tr>
                    <td>⚡ EC</td>
                    <td id="live-ec">--</td>
                    <td>mS/cm</td>
                </tr>
                <tr>
                    <td>🌊 Salinity</td>
                    <td id="live-sal">--</td>
                    <td>ppt</td>
                </tr>
                <tr>
                    <td>🧪 pH</td>
                    <td id="live-ph">--</td>
                    <td></td>
                </tr>
                <tr>
                    <td>💧 TDS</td>
                    <td id="live-tds">--</td>
                    <td>ppm</td>
                </tr>
            </table>
        </div>

        <hr class="divider">

        <div>
            <h2>🔒 Status</h2>
            <div id="currentStatus" class="status">Current: --</div>
            <div id="futureStatus"  class="status">Future: --</div>
        </div>

        <hr class="divider">

        <p class="last-updated">
            Last prediction update: <span id="lastUpdated">--</span>
        </p>

    </div>
</div>

<script type="module">
import { initializeApp }             from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE =====
const firebaseConfig = {
    apiKey:      "AIzaSyAgWgICxcrEMbrgw6LhXbZzmUymCOMhMXE",
    authDomain:  "thesis-project-38954.firebaseapp.com",
    databaseURL: "https://thesis-project-38954-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:   "thesis-project-38954",
};

const app      = initializeApp(firebaseConfig);
const database = getDatabase(app);

// ===== CHART DEFINITIONS =====
const chartConfigs = {
    temp: { id: 'tempChart', title: 'Temperature vs Time', unit: '°C'    },
    ec:   { id: 'ecChart',   title: 'EC vs Time',          unit: 'mS/cm' },
    sal:  { id: 'salChart',  title: 'Salinity vs Time',    unit: 'ppt'   },
    ph:   { id: 'phChart',   title: 'pH vs Time',          unit: 'pH'    },
    tds:  { id: 'tdsChart',  title: 'TDS vs Time',         unit: 'ppm'   },
};

const charts     = {};
const MAX_POINTS = 20;

const historyData = {
    temp: [], ec: [], sal: [], ph: [], tds: [], times: []
};

// ===== INIT CHARTS =====
function initCharts() {
    for (const [key, cfg] of Object.entries(chartConfigs)) {
        const ctx    = document.getElementById(cfg.id);
        charts[key]  = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label:       'Measured',
                        data:        [],
                        borderColor: 'blue',
                        fill:        false,
                        tension:     0.1,
                        pointRadius: 3,
                    },
                    {
                        label:       'Predicted',
                        data:        [],
                        borderColor: 'red',
                        borderDash:  [5, 5],
                        fill:        false,
                        tension:     0.1,
                        pointRadius: 3,
                    }
                ]
            },
            options: {
                animation: false,
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text:    cfg.title,
                        color:   '#1e293b',
                        font:    { size: 14 }
                    },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Time' },
                        ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } }
                    },
                    y: {
                        title: { display: true, text: cfg.unit }
                    }
                }
            }
        });
    }
}

// ===== UPDATE CHARTS =====
function updateCharts(predictions) {
    const times   = historyData.times.slice(-MAX_POINTS);
    const now     = new Date();

    for (const [key, chart] of Object.entries(charts)) {
        const fieldMap = { temp: 'temperature', ec: 'ec', sal: 'salinity', ph: 'ph', tds: 'tds' };
        const rawData  = historyData[key].slice(-MAX_POINTS);

        let predData  = [];
        let predTimes = [];

        if (predictions) {
            for (let i = 1; i <= 15; i++) {
                const point = predictions[`point${i}`];
                if (point) {
                    predData.push(point[fieldMap[key]]);
                    const t = new Date(now.getTime() + i * 1000);
                    predTimes.push(t.toLocaleTimeString());
                }
            }
        }

        const fullTimes  = times.concat(predTimes);
        const paddedRaw  = rawData.concat(new Array(predData.length).fill(null));
        const paddedPred = new Array(rawData.length).fill(null).concat(predData);

        chart.data.labels           = fullTimes;
        chart.data.datasets[0].data = paddedRaw;
        chart.data.datasets[1].data = paddedPred;
        chart.update();
    }
}

// ===== FIREBASE LISTENERS =====
let latestPredictions = null;

// Live raw sensor readings
onValue(ref(database, 'sensors'), (snapshot) => {
    const d = snapshot.val();
    if (!d) return;

    // Update live readings display
    document.getElementById('live-temp').innerText = Number(d.temperature).toFixed(2);
    document.getElementById('live-ec').innerText   = Number(d.ec).toFixed(2);
    document.getElementById('live-sal').innerText  = Number(d.salinity).toFixed(2);
    document.getElementById('live-ph').innerText   = Number(d.ph).toFixed(2);
    document.getElementById('live-tds').innerText  = Number(d.tds).toFixed(2);

    // Build history
    const now = new Date().toLocaleTimeString();
    historyData.times.push(now);
    historyData.temp.push(d.temperature);
    historyData.ec.push(d.ec);
    historyData.sal.push(d.salinity);
    historyData.ph.push(d.ph);
    historyData.tds.push(d.tds);

    // Keep only last MAX_POINTS
    for (const key of Object.keys(historyData)) {
        if (historyData[key].length > MAX_POINTS) historyData[key].shift();
    }

    updateCharts(latestPredictions);
});

// Predictions from MATLAB via Firebase
onValue(ref(database, 'predictions'), (snapshot) => {
    const d = snapshot.val();
    if (!d) return;

    latestPredictions = d;

    // Current status
    const currentEl       = document.getElementById('currentStatus');
    const isSafe          = d.current_status == 1;
    currentEl.innerText   = 'Current: ' + (isSafe ? 'SAFE ✅' : 'UNSAFE ❌');
    currentEl.className   = 'status ' + (isSafe ? 'safe' : 'unsafe');

    // Future status (use point1 as next predicted status)
    const futureEl        = document.getElementById('futureStatus');
    const futureSafe      = d.point1 && d.point1.status == 1;
    futureEl.innerText    = 'Future: '  + (futureSafe ? 'SAFE ✅' : 'UNSAFE ❌');
    futureEl.className    = 'status '   + (futureSafe ? 'safe' : 'unsafe');

    // Last updated timestamp
    document.getElementById('lastUpdated').innerText = d.last_updated || '--';

    updateCharts(d);
});

// ===== START =====
initCharts();
</script>

</body>
</html>
